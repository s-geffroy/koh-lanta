<figure class="figure">
<svg class="graphique" viewBox="0 0 700 176" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Le même calcul, à conseil égal">
  <title>Le même calcul, à conseil égal</title>
  <desc>Rapports de cotes d&#x27;un logit conditionnel : chaque conseil est son propre groupe de comparaison, ce qui tient la taille du conseil rigoureusement fixe. Référence : aucune voix au conseil précédent.</desc>
  <line x1="230.3" y1="26" x2="230.3" y2="124" stroke="var(--encre-douce)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="230.3" y="20.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">1</text>
  <g class="marque"><title>1 ou 2 voix au conseil précédent : cote multipliée par 2.11 (de 1.38 à 3.21)</title><line x1="263.9" y1="53.0" x2="425.7" y2="53.0" stroke="var(--serie-1)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="328.4" cy="53.0" r="4.4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1.6"/></g>
  <text x="160.0" y="53.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">1 ou 2 voix</text>
  <text x="620.0" y="53.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">2.11</text>
  <g class="marque"><title>3 voix au conseil précédent : cote multipliée par 1.83 (de 0.68 à 4.93)</title><line x1="202.0" y1="79.0" x2="577.8" y2="79.0" stroke="var(--encre-muette)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="303.7" cy="79.0" r="4.4" fill="var(--encre-muette)" stroke="var(--surface)" stroke-width="1.6"/></g>
  <text x="160.0" y="79.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">3 voix</text>
  <text x="620.0" y="79.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">1.83</text>
  <g class="marque"><title>4 voix et plus au conseil précédent : cote multipliée par 1.36 (de 0.66 à 2.81)</title><line x1="200.2" y1="105.0" x2="390.3" y2="105.0" stroke="var(--encre-muette)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="262.1" cy="105.0" r="4.4" fill="var(--encre-muette)" stroke="var(--surface)" stroke-width="1.6"/></g>
  <text x="160.0" y="105.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">4 voix et plus</text>
  <text x="620.0" y="105.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">1.36</text>
  <text x="170.0" y="162.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-muette)" font-size="11">1074 présences, 144 conseils</text>
</svg>
</figure>
