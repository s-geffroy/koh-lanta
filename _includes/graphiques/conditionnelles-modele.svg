<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">Le même calcul, à conseil égal</figcaption>
<svg class="graphique" viewBox="0 0 700 176" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Le même calcul, à conseil égal">
  <title>Le même calcul, à conseil égal</title>
  <desc>Rapports de cotes d&#x27;un logit conditionnel : chaque conseil est son propre groupe de comparaison, ce qui tient la taille du conseil rigoureusement fixe. Référence : aucune voix au conseil précédent.</desc>
  <line x1="200.2" y1="26" x2="200.2" y2="124" stroke="var(--encre-douce)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="200.2" y="20.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">1</text>
  <g class="marque"><title>1 ou 2 voix au conseil précédent : cote multipliée par 1,96 (de 1,34 à 2,86)</title><line x1="236.9" y1="53.0" x2="400.9" y2="53.0" stroke="var(--serie-1)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="303.8" cy="53.0" r="4.4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1.6"/><text x="160.0" y="53.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">1 ou 2 voix</text><text x="620.0" y="53.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">1,96</text></g>
  <g class="marque"><title>3 voix au conseil précédent : cote multipliée par 2,12 (de 1 à 4,5)</title><line x1="200.2" y1="79.0" x2="577.8" y2="79.0" stroke="var(--encre-muette)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="321.0" cy="79.0" r="4.4" fill="var(--encre-muette)" stroke="var(--surface)" stroke-width="1.6"/><text x="160.0" y="79.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">3 voix</text><text x="620.0" y="79.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">2,12</text></g>
  <g class="marque"><title>4 voix et plus au conseil précédent : cote multipliée par 1,97 (de 1,03 à 3,78)</title><line x1="203.4" y1="105.0" x2="500.1" y2="105.0" stroke="var(--serie-1)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="304.9" cy="105.0" r="4.4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1.6"/><text x="160.0" y="105.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">4 voix et plus</text><text x="620.0" y="105.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">1,97</text></g>
  <text x="170.0" y="162.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-muette)" font-size="11">1398 présences, 192 conseils</text>
</svg>
</figure>
