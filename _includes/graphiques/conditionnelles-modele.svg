<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">Le même calcul, à conseil égal</figcaption>
<svg class="graphique" viewBox="0 0 700 176" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Le même calcul, à conseil égal">
  <title>Le même calcul, à conseil égal</title>
  <desc>Rapports de cotes d’un logit conditionnel : chaque conseil est son propre groupe de comparaison, ce qui tient la taille du conseil rigoureusement fixe. Référence : aucune voix au conseil précédent.</desc>
  <line x1="279.2" y1="26" x2="279.2" y2="124" stroke="var(--encre-douce)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="279.2" y="20.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">1</text>
  <g class="marque"><title>1 ou 2 voix au conseil précédent : cote multipliée par 1,92 (de 1,34 à 2,54)</title><line x1="337.5" y1="53.0" x2="543.5" y2="53.0" stroke="var(--serie-1)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="437.1" cy="53.0" r="4.4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1.6"/><text x="160.0" y="53.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">1 ou 2 voix</text><text x="620.0" y="53.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">1,92</text></g>
  <g class="marque"><title>3 voix au conseil précédent : cote multipliée par 1,46 (de 0,54 à 2,71)</title><line x1="200.2" y1="79.0" x2="572.6" y2="79.0" stroke="var(--encre-muette)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="358.1" cy="79.0" r="4.4" fill="var(--encre-muette)" stroke="var(--surface)" stroke-width="1.6"/><text x="160.0" y="79.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">3 voix</text><text x="620.0" y="79.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">1,46</text></g>
  <g class="marque"><title>4 voix et plus au conseil précédent : cote multipliée par 1,72 (de 0,87 à 2,74)</title><line x1="256.8" y1="105.0" x2="577.8" y2="105.0" stroke="var(--encre-muette)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="402.7" cy="105.0" r="4.4" fill="var(--encre-muette)" stroke="var(--surface)" stroke-width="1.6"/><text x="160.0" y="105.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">4 voix et plus</text><text x="620.0" y="105.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">1,72</text></g>
  <text x="170.0" y="162.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-muette)" font-size="11">1720 présences, 228 conseils</text>
</svg>
</figure>
