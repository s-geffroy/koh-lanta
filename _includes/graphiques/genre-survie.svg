  <g class="marque"><title>Femmes — 2010s : 56.4 %</title><circle cx="355.0" cy="82.0" r="4.5" fill="var(--serie-5)" stroke="var(--surface)" stroke-width="2"/></g>
  <g class="marque"><title>Femmes — 2020s : 61.2 %</title><circle cx="664.0" cy="66.5" r="4.5" fill="var(--serie-5)" stroke="var(--surface)" stroke-width="2"/></g>
