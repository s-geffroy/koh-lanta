<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">L’adversaire, encore là ou déjà parti</figcaption>
<svg class="graphique surbrillance barres-ladversaire-encore-la-ou-deja-parti" viewBox="0 0 780 220" role="img" preserveAspectRatio="xMidYMid meet" aria-label="L’adversaire, encore là ou déjà parti">
  <title>L’adversaire, encore là ou déjà parti</title>
  <desc>Probabilité d’être éliminé selon que ceux qui ont déjà écrit votre nom sont encore présents ou non.</desc>
  <style>.barres-ladversaire-encore-la-ou-deja-parti .s{transition:opacity .12s ease}.barres-ladversaire-encore-la-ou-deja-parti:has(.marque:not(.repere):hover) .s{opacity:.15}.barres-ladversaire-encore-la-ou-deja-parti:has(.marque.s0:hover) .s.s0{opacity:1}.barres-ladversaire-encore-la-ou-deja-parti:has(.marque.s1:hover) .s.s1{opacity:1}</style>
  <line x1="373.5" y1="36" x2="373.5" y2="196" stroke="var(--grille)" stroke-width="1"/>
  <line x1="487.0" y1="36" x2="487.0" y2="196" stroke="var(--grille)" stroke-width="1"/>
  <line x1="600.5" y1="36" x2="600.5" y2="196" stroke="var(--grille)" stroke-width="1"/>
  <line x1="714.0" y1="36" x2="714.0" y2="196" stroke="var(--grille)" stroke-width="1"/>
  <rect x="260" y="12" width="11" height="11" rx="3" fill="var(--serie-1)"/>
  <text x="277.0" y="18.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="12">risque observé</text>
  <rect x="386.8" y="12" width="11" height="11" rx="3" fill="var(--serie-6)"/>
  <text x="403.8" y="18.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="12">1 / nombre de présents</text>
  <text x="250.0" y="65.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">jamais visé jusqu’ici</text>
  <g class="marque s s0"><title>115 éliminations sur 1076 présences</title><rect x="260" y="44.0" width="203.3" height="20.0" rx="3" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s0"><text x="470.3" y="54.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">10,7 %</text></g>
  <g class="marque s s1"><title>13,2 % si l’éliminé était tiré au hasard</title><rect x="260" y="66.0" width="250.7" height="20.0" rx="3" fill="var(--serie-6)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s1"><text x="517.7" y="76.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">13,2 %</text></g>
  <text x="250.0" y="119.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">ses adversaires sont partis</text>
  <g class="marque s s0"><title>34 éliminations sur 142 présences</title><rect x="260" y="98.0" width="454.0" height="20.0" rx="3" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s0"><text x="721.0" y="108.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">23,9 %</text></g>
  <g class="marque s s1"><title>15,9 % si l’éliminé était tiré au hasard</title><rect x="260" y="120.0" width="302.0" height="20.0" rx="3" fill="var(--serie-6)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s1"><text x="569.0" y="130.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">15,9 %</text></g>
  <text x="250.0" y="173.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="12">au moins un adversaire encore là</text>
  <g class="marque s s0"><title>72 éliminations sur 418 présences</title><rect x="260" y="152.0" width="326.7" height="20.0" rx="3" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s0"><text x="593.7" y="162.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">17,2 %</text></g>
  <g class="marque s s1"><title>13,5 % si l’éliminé était tiré au hasard</title><rect x="260" y="174.0" width="256.4" height="20.0" rx="3" fill="var(--serie-6)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s1"><text x="523.4" y="184.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">13,5 %</text></g>
  <line x1="260" y1="36" x2="260" y2="196" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
