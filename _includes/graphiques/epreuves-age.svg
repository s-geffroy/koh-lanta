  <g class="marque"><title>25–29 ans : 104 victoires pour 108 aventuriers</title><rect x="178.5" y="66.4" width="46.0" height="161.6" rx="4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"/><text x="201.5" y="56.4" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">0,96</text><text x="201.5" y="244.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">25–29</text></g>
