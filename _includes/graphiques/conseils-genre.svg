  <line x1="516.0" y1="10" x2="516.0" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <line x1="618.0" y1="10" x2="618.0" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>599 bulletins, soit 30.4 % des voix des conseils complets</title><rect x="210" y="16" width="408.0" height="26" rx="4" fill="var(--serie-7)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="200.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">un homme → une femme</text>
  <text x="626.0" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">30.4 %</text>
