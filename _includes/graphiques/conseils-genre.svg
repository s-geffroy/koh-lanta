  <text x="200.0" y="131.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">un homme → un homme</text>
  <text x="515.6" y="131.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">22.6 %</text>
  <line x1="210" y1="10" x2="210" y2="148" stroke="var(--axe)" stroke-width="1"/>
