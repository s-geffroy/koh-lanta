  <text x="200.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">une femme → un homme</text>
  <text x="542.8" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">24.2 %</text>
  <g class="marque"><title>460 bulletins, soit 23.4 % des voix des conseils complets</title><rect x="210" y="84" width="314.1" height="26" rx="4" fill="var(--serie-7)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="200.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">un homme → un homme</text>
  <text x="532.1" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">23.4 %</text>
