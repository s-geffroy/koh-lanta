<figure class="figure">
<svg class="graphique" viewBox="0 0 680 174" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Qui vote contre qui">
  <title>Qui vote contre qui</title>
  <desc>Répartition des bulletins selon le sexe du votant et de sa cible.</desc>
  <line x1="311.4" y1="10" x2="311.4" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <line x1="412.8" y1="10" x2="412.8" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <line x1="514.2" y1="10" x2="514.2" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <line x1="615.6" y1="10" x2="615.6" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>815 bulletins, soit 30.6 % des voix des conseils complets</title><rect x="210" y="16" width="405.6" height="26" rx="4" fill="var(--serie-7)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">un homme → une femme</text><text x="623.6" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">30.6 %</text></g>
  <g class="marque"><title>638 bulletins, soit 23.9 % des voix des conseils complets</title><rect x="210" y="50" width="316.8" height="26" rx="4" fill="var(--serie-7)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">une femme → une femme</text><text x="534.8" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">23.9 %</text></g>
  <g class="marque"><title>618 bulletins, soit 23.2 % des voix des conseils complets</title><rect x="210" y="84" width="307.5" height="26" rx="4" fill="var(--serie-7)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">une femme → un homme</text><text x="525.5" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">23.2 %</text></g>
  <g class="marque"><title>594 bulletins, soit 22.3 % des voix des conseils complets</title><rect x="210" y="118" width="295.6" height="26" rx="4" fill="var(--serie-7)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="131.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">un homme → un homme</text><text x="513.6" y="131.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">22.3 %</text></g>
  <line x1="210" y1="10" x2="210" y2="148" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
