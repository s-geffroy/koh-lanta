  <g class="marque"><title>476 bulletins, soit 23.0 % des voix des conseils complets</title><rect x="210" y="84" width="307.7" height="26" rx="4" fill="var(--serie-7)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="200.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">un homme → un homme</text>
