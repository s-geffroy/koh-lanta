  <text x="531.4" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">23.8 %</text>
  <g class="marque"><title>588 bulletins, soit 22.8 % des voix des conseils complets</title><rect x="210" y="84" width="300.3" height="26" rx="4" fill="var(--serie-7)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="200.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">une femme → un homme</text>
  <text x="518.3" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">22.8 %</text>
