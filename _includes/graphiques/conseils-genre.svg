<figure class="figure">
<svg class="graphique" viewBox="0 0 680 174" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Qui vote contre qui">
  <title>Qui vote contre qui</title>
  <desc>Répartition des bulletins selon le sexe du votant et de sa cible.</desc>
  <line x1="312.0" y1="10" x2="312.0" y2="148" stroke="var(--grille)" stroke-width="1"/>
