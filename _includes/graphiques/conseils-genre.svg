<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">Qui vote contre qui</figcaption>
<svg class="graphique" viewBox="0 0 680 174" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Qui vote contre qui">
  <title>Qui vote contre qui</title>
  <desc>Répartition des bulletins selon le sexe du votant et de sa cible.</desc>
  <line x1="311.4" y1="10" x2="311.4" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <line x1="412.8" y1="10" x2="412.8" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <line x1="514.2" y1="10" x2="514.2" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <line x1="615.6" y1="10" x2="615.6" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>825 bulletins, soit 30,7 % des voix des conseils complets</title><rect x="210" y="16" width="405.6" height="26" rx="4" fill="var(--serie-7)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">un homme → une femme</text><text x="623.6" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">30,7 %</text></g>
  <g class="marque"><title>648 bulletins, soit 24,1 % des voix des conseils complets</title><rect x="210" y="50" width="318.4" height="26" rx="4" fill="var(--serie-7)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">une femme → une femme</text><text x="536.4" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">24,1 %</text></g>
  <g class="marque"><title>621 bulletins, soit 23,1 % des voix des conseils complets</title><rect x="210" y="84" width="305.2" height="26" rx="4" fill="var(--serie-7)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">une femme → un homme</text><text x="523.2" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">23,1 %</text></g>
  <g class="marque"><title>597 bulletins, soit 22,2 % des voix des conseils complets</title><rect x="210" y="118" width="293.3" height="26" rx="4" fill="var(--serie-7)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="131.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">un homme → un homme</text><text x="511.3" y="131.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">22,2 %</text></g>
  <line x1="210" y1="10" x2="210" y2="148" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
