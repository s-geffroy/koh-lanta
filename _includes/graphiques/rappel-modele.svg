  <line x1="599.4" y1="184" x2="599.4" y2="188" stroke="var(--axe)" stroke-width="1"/>
  <text x="599.4" y="200.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">1</text>
  <line x1="673.2" y1="184" x2="673.2" y2="188" stroke="var(--axe)" stroke-width="1"/>
