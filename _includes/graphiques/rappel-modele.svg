<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">À longévité égale, qui est redemandé</figcaption>
<svg class="graphique" viewBox="0 0 780 228" role="img" preserveAspectRatio="xMidYMid meet" aria-label="À longévité égale, qui est redemandé">
  <title>À longévité égale, qui est redemandé</title>
  <desc>Rapports de cotes d’une régression logistique sur les premières participations. Au-dessus de 1 : rappelé plus souvent, toutes les autres variables tenues fixes.</desc>
  <line x1="513.5" y1="26" x2="513.5" y2="176" stroke="var(--encre-douce)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="513.5" y="20.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">1</text>
  <g class="marque"><title>Part de saison tenue (+10 points) : cote multipliée par 1,42 (de 1,26 à 1,6)</title><line x1="576.0" y1="53.0" x2="657.8" y2="53.0" stroke="var(--serie-1)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="614.5" cy="53.0" r="4.4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1.6"/><text x="240.0" y="53.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">Part de saison tenue (+10 points)</text><text x="700.0" y="53.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">1,42</text></g>
  <g class="marque"><title>Avoir abandonné : cote multipliée par 0,17 (de 0,03 à 1,05)</title><line x1="280.2" y1="79.0" x2="525.5" y2="79.0" stroke="var(--encre-muette)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="313.9" cy="79.0" r="4.4" fill="var(--encre-muette)" stroke="var(--surface)" stroke-width="1.6"/><text x="240.0" y="79.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">Avoir abandonné</text><text x="700.0" y="79.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">0,17</text></g>
  <g class="marque"><title>Être une femme : cote multipliée par 0,92 (de 0,6 à 1,42)</title><line x1="417.3" y1="105.0" x2="614.5" y2="105.0" stroke="var(--encre-muette)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="494.3" cy="105.0" r="4.4" fill="var(--encre-muette)" stroke="var(--surface)" stroke-width="1.6"/><text x="240.0" y="105.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">Être une femme</text><text x="700.0" y="105.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">0,92</text></g>
  <g class="marque"><title>Âge (+10 ans) : cote multipliée par 0,7 (de 0,59 à 0,83)</title><line x1="414.9" y1="131.0" x2="472.6" y2="131.0" stroke="var(--serie-1)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="441.3" cy="131.0" r="4.4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1.6"/><text x="240.0" y="131.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">Âge (+10 ans)</text><text x="700.0" y="131.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">0,7</text></g>
  <g class="marque"><title>Époque (+10 ans) : cote multipliée par 0,74 (de 0,46 à 1,18)</title><line x1="383.6" y1="157.0" x2="556.8" y2="157.0" stroke="var(--encre-muette)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="451.0" cy="157.0" r="4.4" fill="var(--encre-muette)" stroke="var(--surface)" stroke-width="1.6"/><text x="240.0" y="157.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">Époque (+10 ans)</text><text x="700.0" y="157.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">0,74</text></g>
  <text x="250.0" y="214.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-muette)" font-size="11">489 premières participations, 92 rappelées</text>
</svg>
</figure>
