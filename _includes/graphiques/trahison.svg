  <g class="marque"><title>987 tirages sur 4000 entre 56,5 et 56,9</title><rect x="505.8" y="65.4" width="20.3" height="138.6" fill="var(--serie-3)" opacity="0.45"/></g>
  <g class="marque"><title>1125 tirages sur 4000 entre 56,9 et 57,4</title><rect x="527.7" y="46.0" width="20.3" height="158.0" fill="var(--serie-3)" opacity="0.45"/></g>
  <g class="marque"><title>749 tirages sur 4000 entre 57,4 et 57,8</title><rect x="549.5" y="98.8" width="20.3" height="105.2" fill="var(--serie-3)" opacity="0.45"/></g>
  <g class="marque"><title>302 tirages sur 4000 entre 57,8 et 58,2</title><rect x="571.4" y="161.6" width="20.3" height="42.4" fill="var(--serie-3)" opacity="0.45"/></g>
