  <line x1="513.0" y1="36" x2="513.0" y2="466" stroke="var(--grille)" stroke-width="1"/>
  <line x1="614.0" y1="36" x2="614.0" y2="466" stroke="var(--grille)" stroke-width="1"/>
  <rect x="210" y="12" width="11" height="11" rx="3" fill="var(--serie-1)"/>
