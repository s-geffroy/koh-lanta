  <text x="263.7" y="378.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">7.0 %</text>
  <g class="marque"><title>6.5 % des 475 aventuriers ayant traverse autant de conseils</title><rect x="210" y="390.0" width="43.3" height="20.0" rx="3" fill="var(--serie-2)" stroke="var(--surface)" stroke-width="1"/></g>
