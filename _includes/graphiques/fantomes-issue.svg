  <g class="marque"><title>5.5 % des 475 aventuriers ayant traverse autant de conseils</title><rect x="210" y="66.0" width="36.7" height="20.0" rx="3" fill="var(--serie-2)" stroke="var(--surface)" stroke-width="1"/></g>
