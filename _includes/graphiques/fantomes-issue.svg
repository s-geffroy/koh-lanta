  <text x="200.0" y="443.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Abandon volontaire</text>
  <g class="marque"><title>4 des 71 fantômes, soit 5.6 %</title><rect x="210" y="422.0" width="37.3" height="20.0" rx="3" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1"/></g>
