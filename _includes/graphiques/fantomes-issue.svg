  <title>Ce que devient un aventurier que personne ne vise</title>
  <desc>Sort final des aventuriers n&#x27;ayant recu aucune voix, compare a ceux qui ont traverse autant de conseils qu&#x27;eux -- et non a l&#x27;ensemble, qui melangerait le fait de n&#x27;etre pas vise et celui d&#x27;aller loin.</desc>
  <line x1="311.0" y1="36" x2="311.0" y2="466" stroke="var(--grille)" stroke-width="1"/>
