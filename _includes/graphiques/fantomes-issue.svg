  <g class="marque"><title>5 des 65 fantômes, soit 7.7 %</title><rect x="210" y="368.0" width="52.0" height="20.0" rx="3" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1"/></g>
  <text x="269.0" y="378.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">7.7 %</text>
  <g class="marque"><title>7.1 % des 438 aventuriers ayant traverse autant de conseils</title><rect x="210" y="390.0" width="48.0" height="20.0" rx="3" fill="var(--serie-2)" stroke="var(--surface)" stroke-width="1"/></g>
