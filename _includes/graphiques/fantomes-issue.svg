  <g class="marque"><title>5.4 % des 443 aventuriers ayant traverse autant de conseils</title><rect x="210" y="66.0" width="36.2" height="20.0" rx="3" fill="var(--serie-2)" stroke="var(--surface)" stroke-width="1"/></g>
