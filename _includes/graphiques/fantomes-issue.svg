  <rect x="351.2" y="12" width="11" height="11" rx="3" fill="var(--serie-2)"/>
  <text x="368.2" y="18.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="12">Ceux qui ont tenu autant</text>
  <text x="200.0" y="65.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Abandon médical</text>
