<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">L’isolement, décomposé</figcaption>
<svg class="graphique surbrillance barres-lisolement-decompose" viewBox="0 0 780 274" role="img" preserveAspectRatio="xMidYMid meet" aria-label="L’isolement, décomposé">
  <title>L’isolement, décomposé</title>
  <desc>Probabilité d’être éliminé selon le nombre de gens avec qui on a déjà voté et qui sont encore présents.</desc>
  <style>.barres-lisolement-decompose .s{transition:opacity .12s ease}.barres-lisolement-decompose:has(.marque:not(.repere):hover) .s{opacity:.15}.barres-lisolement-decompose:has(.marque.s0:hover) .s.s0{opacity:1}.barres-lisolement-decompose:has(.marque.s1:hover) .s.s1{opacity:1}</style>
  <line x1="366.0" y1="36" x2="366.0" y2="250" stroke="var(--grille)" stroke-width="1"/>
  <line x1="482.0" y1="36" x2="482.0" y2="250" stroke="var(--grille)" stroke-width="1"/>
  <line x1="598.0" y1="36" x2="598.0" y2="250" stroke="var(--grille)" stroke-width="1"/>
  <line x1="714.0" y1="36" x2="714.0" y2="250" stroke="var(--grille)" stroke-width="1"/>
  <rect x="250" y="12" width="11" height="11" rx="3" fill="var(--serie-1)"/>
  <text x="267.0" y="18.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="12">risque observé</text>
  <rect x="376.8" y="12" width="11" height="11" rx="3" fill="var(--serie-6)"/>
  <text x="393.8" y="18.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="12">1 / nombre de présents</text>
  <text x="240.0" y="65.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">n’a jamais voté avec personne</text>
  <g class="marque s s0"><title>8 éliminations sur 29 présences</title><rect x="250" y="44.0" width="464.0" height="20.0" rx="3" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s0"><text x="721.0" y="54.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">27,6 %</text></g>
  <g class="marque s s1"><title>13,8 % si l’éliminé était tiré au hasard</title><rect x="250" y="66.0" width="232.0" height="20.0" rx="3" fill="var(--serie-6)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s1"><text x="489.0" y="76.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">13,8 %</text></g>
  <text x="240.0" y="119.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">tous ses alliés sont partis</text>
  <g class="marque s s0"><title>11 éliminations sur 40 présences</title><rect x="250" y="98.0" width="462.3" height="20.0" rx="3" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s0"><text x="719.3" y="108.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">27,5 %</text></g>
  <g class="marque s s1"><title>16,2 % si l’éliminé était tiré au hasard</title><rect x="250" y="120.0" width="272.3" height="20.0" rx="3" fill="var(--serie-6)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s1"><text x="529.3" y="130.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">16,2 %</text></g>
  <text x="240.0" y="173.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">1 ou 2 alliés présents</text>
  <g class="marque s s0"><title>41 éliminations sur 246 présences</title><rect x="250" y="152.0" width="280.8" height="20.0" rx="3" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s0"><text x="537.8" y="162.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">16,7 %</text></g>
  <g class="marque s s1"><title>14 % si l’éliminé était tiré au hasard</title><rect x="250" y="174.0" width="235.4" height="20.0" rx="3" fill="var(--serie-6)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s1"><text x="492.4" y="184.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">14 %</text></g>
  <text x="240.0" y="227.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">3 alliés ou plus</text>
  <g class="marque s s0"><title>168 éliminations sur 1405 présences</title><rect x="250" y="206.0" width="201.7" height="20.0" rx="3" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s0"><text x="458.7" y="216.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">12 %</text></g>
  <g class="marque s s1"><title>13 % si l’éliminé était tiré au hasard</title><rect x="250" y="228.0" width="218.6" height="20.0" rx="3" fill="var(--serie-6)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s1"><text x="475.6" y="238.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">13 %</text></g>
  <line x1="250" y1="36" x2="250" y2="250" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
