<figure class="figure">
<svg class="graphique" viewBox="0 0 740 176" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Ce que la force change aux bulletins reçus">
  <title>Ce que la force change aux bulletins reçus</title>
  <desc>Rapports de taux, a exposition egale. Un intervalle qui traverse 1 veut dire qu&#x27;on ne peut pas conclure.</desc>
  <line x1="388.7" y1="26" x2="388.7" y2="124" stroke="var(--encre-douce)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="388.7" y="20.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">1</text>
  <g class="marque"><title>Force doublée → bulletins reçus : 0.915 (intervalle 0.792 à 1.056)</title><line x1="294.2" y1="53.0" x2="414.2" y2="53.0" stroke="var(--encre-muette)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="350.1" cy="53.0" r="4.4" fill="var(--encre-muette)" stroke="var(--surface)" stroke-width="1.6"/></g>
  <text x="258.0" y="53.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">Force doublée → bulletins reçus</text>
  <text x="660.0" y="53.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">0.915</text>
  <g class="marque"><title>Femme → bulletins reçus : 1.2 (intervalle 0.952 à 1.513)</title><line x1="366.9" y1="79.0" x2="621.8" y2="79.0" stroke="var(--encre-muette)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="479.6" cy="79.0" r="4.4" fill="var(--encre-muette)" stroke="var(--surface)" stroke-width="1.6"/></g>
  <text x="258.0" y="79.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">Femme → bulletins reçus</text>
  <text x="660.0" y="79.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">1.2</text>
  <g class="marque"><title>Dix ans de plus → bulletins reçus : 1.157 (intervalle 1.029 à 1.301)</title><line x1="401.9" y1="105.0" x2="525.5" y2="105.0" stroke="var(--serie-1)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="460.0" cy="105.0" r="4.4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1.6"/></g>
  <text x="258.0" y="105.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">Dix ans de plus → bulletins reçus</text>
  <text x="660.0" y="105.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">1.157</text>
  <text x="268.0" y="162.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-muette)" font-size="11">La ligne verticale marque « aucun effet ».</text>
</svg>
</figure>
