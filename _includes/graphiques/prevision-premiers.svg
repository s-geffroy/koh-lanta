  <g class="marque"><title>La fiche d’inscription : l’éliminé est désigné en premier dans 15,9 % des 384 conseils (hasard : 15 %)</title><rect x="126.7" y="89.0" width="46.0" height="159.0" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="149.7" y="79.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">15,9 %</text><text x="149.7" y="264.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">La fiche d’inscription</text></g>
  <g class="marque"><title>La place dans le camp : l’éliminé est désigné en premier dans 20,5 % des 365 conseils (hasard : 15,1 %)</title><rect x="334.0" y="43.0" width="46.0" height="205.0" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="357.0" y="33.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">20,5 %</text><text x="357.0" y="264.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">La place dans le camp</text></g>
  <g class="marque"><title>Ce que la soirée a produit : l’éliminé est désigné en premier dans 22,2 % des 365 conseils (hasard : 15,1 %)</title><rect x="541.3" y="26.0" width="46.0" height="222.0" rx="4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"/><text x="564.3" y="16.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">22,2 %</text><text x="564.3" y="264.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">Ce que la soirée a produit</text></g>
