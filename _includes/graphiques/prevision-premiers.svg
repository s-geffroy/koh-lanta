  <g class="marque"><title>La place dans le camp : l’éliminé est désigné en premier dans 19.3 % des 321 conseils (hasard : 14.3 %)</title><rect x="334.0" y="73.8" width="46.0" height="174.2" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="357.0" y="63.8" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">19.3 %</text><text x="357.0" y="264.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">La place dans le camp</text></g>
