  <line x1="46" y1="137.0" x2="668" y2="137.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="137.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">11</text>
  <line x1="46" y1="81.5" x2="668" y2="81.5" stroke="var(--grille)" stroke-width="1"/>
