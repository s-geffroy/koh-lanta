  <title>Désigner l’éliminé d’une saison jamais vue</title>
  <desc>Part des conseils où le modèle place en tête celui qui part réellement. Une saison est exclue à chaque tour.</desc>
  <line x1="46" y1="248.0" x2="668" y2="248.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="248.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">0</text>
