  <title>Désigner l’éliminé d’une saison jamais vue</title>
  <desc id="desc-prevision-premiers">Part des conseils où le modèle place en tête celui qui part réellement. Une saison est exclue à chaque tour.</desc>
  <line x1="46" y1="248.0" x2="668" y2="248.0" stroke="var(--grille)" stroke-width="1"/>
