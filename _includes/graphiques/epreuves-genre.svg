<figure class="figure">
<svg class="graphique" viewBox="0 0 680 106" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Victoires d&#x27;épreuves selon le sexe">
  <title>Victoires d&#x27;épreuves selon le sexe</title>
  <desc>Nombre moyen d&#x27;épreuves individuelles remportées par aventurier.</desc>
  <line x1="237.0" y1="10" x2="237.0" y2="80" stroke="var(--grille)" stroke-width="1"/>
  <line x1="364.0" y1="10" x2="364.0" y2="80" stroke="var(--grille)" stroke-width="1"/>
  <line x1="491.0" y1="10" x2="491.0" y2="80" stroke="var(--grille)" stroke-width="1"/>
  <line x1="618.0" y1="10" x2="618.0" y2="80" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>Femmes : 145 victoires pour 256 aventuriers</title><rect x="110" y="16" width="311.4" height="26" rx="4" fill="var(--serie-5)" stroke="var(--surface)" stroke-width="2"/></g>
