<figure class="figure">
<svg class="graphique" viewBox="0 0 780 150" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Ce qui décide le vote d&#x27;un juré">
  <title>Ce qui décide le vote d&#x27;un juré</title>
  <desc>Rapports de cotes d&#x27;un logit conditionnel : chaque juré choisit parmi les finalistes de sa saison.</desc>
  <line x1="558.3" y1="26" x2="558.3" y2="98" stroke="var(--encre-douce)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="558.3" y="20.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">1</text>
  <g class="marque"><title>A écrit le nom du juré au conseil : cote ×0.73 (intervalle 0.429 à 1.242)</title><line x1="326.8" y1="53.0" x2="656.4" y2="53.0" stroke="var(--encre-muette)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="448.8" cy="53.0" r="4.4" fill="var(--encre-muette)" stroke="var(--surface)" stroke-width="1.6"/></g>
  <text x="290.0" y="53.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">A écrit le nom du juré au conseil</text>
  <text x="700.0" y="53.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">0.73</text>
  <g class="marque"><title>A voté avec le juré, par conseil partagé : cote ×1.123 (intervalle 1.006 à 1.254)</title><line x1="560.7" y1="79.0" x2="661.2" y2="79.0" stroke="var(--serie-1)" stroke-width="2.6" stroke-linecap="round" opacity="0.55"/><circle cx="608.1" cy="79.0" r="4.4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="1.6"/></g>
  <text x="290.0" y="79.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11.5">A voté avec le juré, par conseil partagé</text>
  <text x="700.0" y="79.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11.5">1.123</text>
  <text x="300.0" y="136.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre-muette)" font-size="11">191 bulletins de jury · 29 saisons</text>
