<figure class="figure">
<svg class="graphique" viewBox="0 0 680 208" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Le destin des colliers d&#x27;immunité">
  <title>Le destin des colliers d&#x27;immunité</title>
  <desc>Ce que devient chaque collier caché dans le jeu.</desc>
  <line x1="342.0" y1="10" x2="342.0" y2="182" stroke="var(--grille)" stroke-width="1"/>
  <line x1="434.0" y1="10" x2="434.0" y2="182" stroke="var(--grille)" stroke-width="1"/>
  <line x1="526.0" y1="10" x2="526.0" y2="182" stroke="var(--grille)" stroke-width="1"/>
  <line x1="618.0" y1="10" x2="618.0" y2="182" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>Joué, et il annule des voix : 26 colliers sur 74, soit 35.1 %</title><rect x="250" y="16" width="368.0" height="26" rx="4" fill="var(--serie-4)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="240.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Joué, et il annule des voix</text>
  <text x="626.0" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">35.1 %</text>
  <g class="marque"><title>Joué pour rien : 20 colliers sur 74, soit 27.0 %</title><rect x="250" y="50" width="283.1" height="26" rx="4" fill="var(--serie-4)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="240.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Joué pour rien</text>
  <text x="541.1" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">27.0 %</text>
  <g class="marque"><title>Jamais trouvé : 12 colliers sur 74, soit 16.2 %</title><rect x="250" y="84" width="169.8" height="26" rx="4" fill="var(--serie-4)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="240.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Jamais trouvé</text>
  <text x="427.8" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">16.2 %</text>
  <g class="marque"><title>Éliminé avec le collier dans le sac : 9 colliers sur 74, soit 12.2 %</title><rect x="250" y="118" width="127.9" height="26" rx="4" fill="var(--serie-4)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="240.0" y="131.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Éliminé avec le collier dans le sac</text>
  <text x="385.9" y="131.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">12.2 %</text>
  <g class="marque"><title>Gardé sans en avoir besoin : 6 colliers sur 74, soit 8.1 %</title><rect x="250" y="152" width="84.9" height="26" rx="4" fill="var(--serie-4)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="240.0" y="165.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Gardé sans en avoir besoin</text>
  <text x="342.9" y="165.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">8.1 %</text>
  <line x1="250" y1="10" x2="250" y2="182" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
