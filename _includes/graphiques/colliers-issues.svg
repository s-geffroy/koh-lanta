<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">Le destin des colliers d’immunité</figcaption>
<svg class="graphique" viewBox="0 0 680 208" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Le destin des colliers d’immunité">
  <title>Le destin des colliers d’immunité</title>
  <desc>Ce que devient chaque collier caché dans le jeu.</desc>
  <line x1="341.4" y1="10" x2="341.4" y2="182" stroke="var(--grille)" stroke-width="1"/>
  <line x1="432.8" y1="10" x2="432.8" y2="182" stroke="var(--grille)" stroke-width="1"/>
  <line x1="524.2" y1="10" x2="524.2" y2="182" stroke="var(--grille)" stroke-width="1"/>
  <line x1="615.6" y1="10" x2="615.6" y2="182" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>Joué, et il annule des voix : 26 colliers sur 71, soit 36,6 %</title><rect x="250" y="16" width="365.6" height="26" rx="4" fill="var(--serie-4)" stroke="var(--surface)" stroke-width="2"/><text x="240.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Joué, et il annule des voix</text><text x="623.6" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">36,6 %</text></g>
  <g class="marque"><title>Joué pour rien : 20 colliers sur 71, soit 28,2 %</title><rect x="250" y="50" width="281.7" height="26" rx="4" fill="var(--serie-4)" stroke="var(--surface)" stroke-width="2"/><text x="240.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Joué pour rien</text><text x="539.7" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">28,2 %</text></g>
  <g class="marque"><title>Jamais trouvé : 12 colliers sur 71, soit 16,9 %</title><rect x="250" y="84" width="168.8" height="26" rx="4" fill="var(--serie-4)" stroke="var(--surface)" stroke-width="2"/><text x="240.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Jamais trouvé</text><text x="426.8" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">16,9 %</text></g>
  <g class="marque"><title>Gardé sans en avoir besoin : 9 colliers sur 71, soit 12,7 %</title><rect x="250" y="118" width="126.9" height="26" rx="4" fill="var(--serie-4)" stroke="var(--surface)" stroke-width="2"/><text x="240.0" y="131.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Gardé sans en avoir besoin</text><text x="384.9" y="131.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">12,7 %</text></g>
  <g class="marque"><title>Éliminé avec le collier dans le sac : 4 colliers sur 71, soit 5,6 %</title><rect x="250" y="152" width="55.9" height="26" rx="4" fill="var(--serie-4)" stroke="var(--surface)" stroke-width="2"/><text x="240.0" y="165.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="10">Éliminé avec le collier dans le sac</text><text x="313.9" y="165.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">5,6 %</text></g>
  <line x1="250" y1="10" x2="250" y2="182" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
