<figure class="figure">
<svg class="graphique surbrillance barres-ce-que-la-reunification-change" viewBox="0 0 680 348" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Ce que la réunification change">
  <title>Ce que la réunification change</title>
  <desc>Cinq mesures du conseil, avant et après la réunification. Le rang de force va de 0, le plus faible du camp, à 100, le plus fort.</desc>
  <style>.barres-ce-que-la-reunification-change .s{transition:opacity .12s ease}.barres-ce-que-la-reunification-change:has(.marque:not(.repere):hover) .s{opacity:.15}.barres-ce-que-la-reunification-change:has(.marque.s0:hover) .s.s0{opacity:1}.barres-ce-que-la-reunification-change:has(.marque.s1:hover) .s.s1{opacity:1}</style>
  <line x1="326.0" y1="36" x2="326.0" y2="324" stroke="var(--grille)" stroke-width="1"/>
  <line x1="422.0" y1="36" x2="422.0" y2="324" stroke="var(--grille)" stroke-width="1"/>
  <line x1="518.0" y1="36" x2="518.0" y2="324" stroke="var(--grille)" stroke-width="1"/>
  <line x1="614.0" y1="36" x2="614.0" y2="324" stroke="var(--grille)" stroke-width="1"/>
  <rect x="230" y="12" width="11" height="11" rx="3" fill="var(--tribu-jaune)"/>
  <text x="247.0" y="18.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="12">avant la fusion</text>
  <rect x="364.0" y="12" width="11" height="11" rx="3" fill="var(--tribu-rouge)"/>
  <text x="381.0" y="18.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="12">après la fusion</text>
  <text x="220.0" y="67.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Présents au conseil</text>
  <g class="marque s s0"><title>16,8 en moyenne avant la fusion</title><rect x="230" y="44.0" width="107.2" height="22.0" rx="3" fill="var(--tribu-jaune)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s0"><text x="344.2" y="55.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">16,8</text></g>
  <g class="marque s s1"><title>8,8 après</title><rect x="230" y="68.0" width="56.1" height="22.0" rx="3" fill="var(--tribu-rouge)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s1"><text x="293.1" y="79.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">8,8</text></g>
  <text x="220.0" y="125.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Conseils serrés (%)</text>
  <g class="marque s s0"><title>32,5 % avant</title><rect x="230" y="102.0" width="207.3" height="22.0" rx="3" fill="var(--tribu-jaune)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s0"><text x="444.3" y="113.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">32,5</text></g>
  <g class="marque s s1"><title>60,1 % après</title><rect x="230" y="126.0" width="383.4" height="22.0" rx="3" fill="var(--tribu-rouge)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s1"><text x="620.4" y="137.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">60,1</text></g>
  <text x="220.0" y="183.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="12">Femmes parmi les éliminés (%)</text>
  <g class="marque s s0"><title>60,2 % avant</title><rect x="230" y="160.0" width="384.0" height="22.0" rx="3" fill="var(--tribu-jaune)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s0"><text x="621.0" y="171.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">60,2</text></g>
  <g class="marque s s1"><title>42,2 % après</title><rect x="230" y="184.0" width="269.2" height="22.0" rx="3" fill="var(--tribu-rouge)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s1"><text x="506.2" y="195.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">42,2</text></g>
  <text x="220.0" y="241.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Âge moyen des éliminés</text>
  <g class="marque s s0"><title>35,2 ans avant</title><rect x="230" y="218.0" width="224.5" height="22.0" rx="3" fill="var(--tribu-jaune)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s0"><text x="461.5" y="229.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">35,2</text></g>
  <g class="marque s s1"><title>32,8 ans après</title><rect x="230" y="242.0" width="209.2" height="22.0" rx="3" fill="var(--tribu-rouge)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s1"><text x="446.2" y="253.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">32,8</text></g>
  <text x="220.0" y="299.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Rang de force de l’éliminé</text>
  <g class="marque s s0"><title>54,6 sur 100 avant</title><rect x="230" y="276.0" width="348.3" height="22.0" rx="3" fill="var(--tribu-jaune)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s0"><text x="585.3" y="287.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">54,6</text></g>
  <g class="marque s s1"><title>49,9 après</title><rect x="230" y="300.0" width="318.3" height="22.0" rx="3" fill="var(--tribu-rouge)" stroke="var(--surface)" stroke-width="1"/></g>
  <g class="s s1"><text x="555.3" y="311.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">49,9</text></g>
  <line x1="230" y1="36" x2="230" y2="324" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
