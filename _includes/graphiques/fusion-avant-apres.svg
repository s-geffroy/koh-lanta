<figure class="figure">
<svg class="graphique" viewBox="0 0 680 348" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Ce que la réunification change">
  <title>Ce que la réunification change</title>
  <desc>Cinq mesures du conseil, avant et après la réunification. Le rang de force va de 0, le plus faible du camp, à 100, le plus fort.</desc>
  <line x1="326.0" y1="36" x2="326.0" y2="324" stroke="var(--grille)" stroke-width="1"/>
  <line x1="422.0" y1="36" x2="422.0" y2="324" stroke="var(--grille)" stroke-width="1"/>
  <line x1="518.0" y1="36" x2="518.0" y2="324" stroke="var(--grille)" stroke-width="1"/>
  <line x1="614.0" y1="36" x2="614.0" y2="324" stroke="var(--grille)" stroke-width="1"/>
  <rect x="230" y="12" width="11" height="11" rx="3" fill="var(--tribu-jaune)"/>
  <text x="247.0" y="18.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="12">avant la fusion</text>
  <rect x="364.0" y="12" width="11" height="11" rx="3" fill="var(--tribu-rouge)"/>
  <text x="381.0" y="18.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="12">après la fusion</text>
  <text x="220.0" y="67.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Présents au conseil</text>
  <g class="marque"><title>17.0 en moyenne avant la fusion</title><rect x="230" y="44.0" width="104.1" height="22.0" rx="3" fill="var(--tribu-jaune)" stroke="var(--surface)" stroke-width="1"/></g>
  <text x="341.1" y="55.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">17.0</text>
  <g class="marque"><title>8.3 après</title><rect x="230" y="68.0" width="50.8" height="22.0" rx="3" fill="var(--tribu-rouge)" stroke="var(--surface)" stroke-width="1"/></g>
  <text x="287.8" y="79.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">8.3</text>
  <text x="220.0" y="125.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Conseils serrés (%)</text>
  <g class="marque"><title>34.9 % avant</title><rect x="230" y="102.0" width="213.7" height="22.0" rx="3" fill="var(--tribu-jaune)" stroke="var(--surface)" stroke-width="1"/></g>
  <text x="450.7" y="113.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">34.9</text>
  <g class="marque"><title>55.5 % après</title><rect x="230" y="126.0" width="339.9" height="22.0" rx="3" fill="var(--tribu-rouge)" stroke="var(--surface)" stroke-width="1"/></g>
  <text x="576.9" y="137.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">55.5</text>
  <text x="220.0" y="183.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Femmes parmi les éliminés (%)</text>
  <g class="marque"><title>53.8 % avant</title><rect x="230" y="160.0" width="329.5" height="22.0" rx="3" fill="var(--tribu-jaune)" stroke="var(--surface)" stroke-width="1"/></g>
  <text x="566.5" y="171.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">53.8</text>
  <g class="marque"><title>46.7 % après</title><rect x="230" y="184.0" width="286.0" height="22.0" rx="3" fill="var(--tribu-rouge)" stroke="var(--surface)" stroke-width="1"/></g>
  <text x="523.0" y="195.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">46.7</text>
  <text x="220.0" y="241.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Âge moyen des éliminés</text>
  <g class="marque"><title>35.1 ans avant</title><rect x="230" y="218.0" width="215.0" height="22.0" rx="3" fill="var(--tribu-jaune)" stroke="var(--surface)" stroke-width="1"/></g>
  <text x="452.0" y="229.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">35.1</text>
  <g class="marque"><title>33.0 ans après</title><rect x="230" y="242.0" width="202.1" height="22.0" rx="3" fill="var(--tribu-rouge)" stroke="var(--surface)" stroke-width="1"/></g>
  <text x="439.1" y="253.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">33.0</text>
  <text x="220.0" y="299.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Rang de force de l’éliminé</text>
  <g class="marque"><title>62.7 sur 100 avant</title><rect x="230" y="276.0" width="384.0" height="22.0" rx="3" fill="var(--tribu-jaune)" stroke="var(--surface)" stroke-width="1"/></g>
  <text x="621.0" y="287.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">62.7</text>
  <g class="marque"><title>47.7 après</title><rect x="230" y="300.0" width="292.1" height="22.0" rx="3" fill="var(--tribu-rouge)" stroke="var(--surface)" stroke-width="1"/></g>
  <text x="529.1" y="311.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">47.7</text>
  <line x1="230" y1="36" x2="230" y2="324" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
