<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">Les quatre facettes décrivent-elles le même talent ?</figcaption>
<svg class="graphique" viewBox="0 0 760 242" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Les quatre facettes décrivent-elles le même talent ?">
  <title>Les quatre facettes décrivent-elles le même talent ?</title>
  <desc>Corrélation de rang entre chaque paire de facettes, sur les 531 joueurs classés, en valeur absolue. Zéro : deux qualités sans rapport. En clair, les paires dont la corrélation est négative.</desc>
  <line x1="368.9" y1="10" x2="368.9" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <line x1="477.8" y1="10" x2="477.8" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <line x1="586.7" y1="10" x2="586.7" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <line x1="695.6" y1="10" x2="695.6" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>ρ = 0,18 entre le parcours et la discrétion</title><rect x="260" y="16" width="78.4" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">parcours · discrétion</text><text x="346.4" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">18,0 %</text></g>
  <g class="marque"><title>ρ = 0,127 entre les épreuves et la discrétion</title><rect x="260" y="50" width="55.3" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">épreuves · discrétion</text><text x="323.3" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">12,7 %</text></g>
  <g class="marque"><title>ρ = -0,066 entre la discrétion et la lecture</title><rect x="260" y="84" width="28.8" height="26" rx="4" fill="var(--serie-5)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">discrétion · lecture</text><text x="296.8" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">6,6 %</text></g>
  <g class="marque"><title>ρ = 0,042 entre les épreuves et la lecture</title><rect x="260" y="118" width="18.3" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="131.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">épreuves · lecture</text><text x="286.3" y="131.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">4,2 %</text></g>
  <g class="marque"><title>ρ = 0,037 entre le parcours et la lecture</title><rect x="260" y="152" width="16.1" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="165.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">parcours · lecture</text><text x="284.1" y="165.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">3,7 %</text></g>
  <g class="marque"><title>ρ = 0,022 entre le parcours et les épreuves</title><rect x="260" y="186" width="9.6" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="199.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">parcours · épreuves</text><text x="277.6" y="199.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">2,2 %</text></g>
  <line x1="260" y1="10" x2="260" y2="216" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
