<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">Les quatre facettes décrivent-elles le même talent ?</figcaption>
<svg class="graphique" viewBox="0 0 760 242" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Les quatre facettes décrivent-elles le même talent ?">
  <title>Les quatre facettes décrivent-elles le même talent ?</title>
  <desc>Corrélation de rang entre chaque paire de facettes, sur les 531 joueurs classés, en valeur absolue. Zéro : deux qualités sans rapport. En clair, les paires dont la corrélation est négative.</desc>
  <line x1="368.9" y1="10" x2="368.9" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <line x1="477.8" y1="10" x2="477.8" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <line x1="586.7" y1="10" x2="586.7" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <line x1="695.6" y1="10" x2="695.6" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>ρ = 0,105 entre les épreuves et la discrétion</title><rect x="260" y="16" width="45.7" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">épreuves · discrétion</text><text x="313.7" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">10,5 %</text></g>
  <g class="marque"><title>ρ = -0,083 entre la discrétion et la lecture</title><rect x="260" y="50" width="36.2" height="26" rx="4" fill="var(--serie-5)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">discrétion · lecture</text><text x="304.2" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">8,3 %</text></g>
  <g class="marque"><title>ρ = 0,035 entre le parcours et la lecture</title><rect x="260" y="84" width="15.2" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">parcours · lecture</text><text x="283.2" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">3,5 %</text></g>
  <g class="marque"><title>ρ = 0,035 entre les épreuves et la lecture</title><rect x="260" y="118" width="15.2" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="131.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">épreuves · lecture</text><text x="283.2" y="131.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">3,5 %</text></g>
  <g class="marque"><title>ρ = 0,026 entre le parcours et la discrétion</title><rect x="260" y="152" width="11.3" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="165.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">parcours · discrétion</text><text x="279.3" y="165.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">2,6 %</text></g>
  <g class="marque"><title>ρ = 0,018 entre le parcours et les épreuves</title><rect x="260" y="186" width="7.8" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="199.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">parcours · épreuves</text><text x="275.8" y="199.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">1,8 %</text></g>
  <line x1="260" y1="10" x2="260" y2="216" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
