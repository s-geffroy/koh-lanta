<figure class="figure">
<svg class="graphique" viewBox="0 0 760 242" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Les quatre facettes décrivent-elles le même talent ?">
  <title>Les quatre facettes décrivent-elles le même talent ?</title>
  <desc>Corrélation de rang entre chaque paire de facettes, sur les 531 joueurs classés, en valeur absolue. Zéro : deux qualités sans rapport. En clair, les paires dont la corrélation est négative.</desc>
  <line x1="369.5" y1="10" x2="369.5" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <line x1="479.0" y1="10" x2="479.0" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <line x1="588.5" y1="10" x2="588.5" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <line x1="698.0" y1="10" x2="698.0" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>ρ = 0,089 entre les épreuves et la discrétion</title><rect x="260" y="16" width="39.0" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">épreuves · discrétion</text><text x="307.0" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">8,9 %</text></g>
  <g class="marque"><title>ρ = -0,083 entre la discrétion et la lecture</title><rect x="260" y="50" width="36.4" height="26" rx="4" fill="var(--serie-5)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">discrétion · lecture</text><text x="304.4" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">8,3 %</text></g>
  <g class="marque"><title>ρ = 0,047 entre les épreuves et la lecture</title><rect x="260" y="84" width="20.6" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">épreuves · lecture</text><text x="288.6" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">4,7 %</text></g>
  <g class="marque"><title>ρ = 0,035 entre le parcours et la lecture</title><rect x="260" y="118" width="15.3" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="131.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">parcours · lecture</text><text x="283.3" y="131.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">3,5 %</text></g>
  <g class="marque"><title>ρ = 0,026 entre le parcours et la discrétion</title><rect x="260" y="152" width="11.4" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="165.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">parcours · discrétion</text><text x="279.4" y="165.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">2,6 %</text></g>
  <g class="marque"><title>ρ = 0,017 entre le parcours et les épreuves</title><rect x="260" y="186" width="7.4" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="199.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">parcours · épreuves</text><text x="275.4" y="199.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">1,7 %</text></g>
  <line x1="260" y1="10" x2="260" y2="216" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
