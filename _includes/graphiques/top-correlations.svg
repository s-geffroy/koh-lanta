<figure class="figure">
<svg class="graphique" viewBox="0 0 760 242" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Les quatre facettes décrivent-elles le même talent ?">
  <title>Les quatre facettes décrivent-elles le même talent ?</title>
  <desc>Corrélation de rang entre chaque paire de facettes, sur les 531 joueurs classés, en valeur absolue. Zéro : deux qualités sans rapport. En clair, les paires dont la corrélation est négative.</desc>
  <line x1="369.5" y1="10" x2="369.5" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <line x1="479.0" y1="10" x2="479.0" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <line x1="588.5" y1="10" x2="588.5" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <line x1="698.0" y1="10" x2="698.0" y2="216" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>ρ = -0.083 entre la discrétion et la lecture</title><rect x="260" y="16" width="36.4" height="26" rx="4" fill="var(--serie-5)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="250.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">discrétion · lecture</text>
  <text x="304.4" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">8.3 %</text>
  <g class="marque"><title>ρ = 0.082 entre les épreuves et la discrétion</title><rect x="260" y="50" width="35.9" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="250.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">épreuves · discrétion</text>
  <text x="303.9" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">8.2 %</text>
  <g class="marque"><title>ρ = 0.061 entre le parcours et la lecture</title><rect x="260" y="84" width="26.7" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="250.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">parcours · lecture</text>
  <text x="294.7" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">6.1 %</text>
  <g class="marque"><title>ρ = 0.031 entre le parcours et la discrétion</title><rect x="260" y="118" width="13.6" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="250.0" y="131.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">parcours · discrétion</text>
  <text x="281.6" y="131.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">3.1 %</text>
  <g class="marque"><title>ρ = 0.012 entre les épreuves et la lecture</title><rect x="260" y="152" width="5.3" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="250.0" y="165.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">épreuves · lecture</text>
  <text x="273.3" y="165.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">1.2 %</text>
  <g class="marque"><title>ρ = -0.001 entre le parcours et les épreuves</title><rect x="260" y="186" width="3.0" height="26" rx="4" fill="var(--serie-5)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="250.0" y="199.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">parcours · épreuves</text>
  <text x="271.0" y="199.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">0.1 %</text>
  <line x1="260" y1="10" x2="260" y2="216" stroke="var(--axe)" stroke-width="1"/>
</svg>
