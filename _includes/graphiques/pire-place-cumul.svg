  <g stroke="var(--surface)" stroke-width="4"><line x1="327.0" y1="165.7" x2="327.0" y2="199.6"/><line x1="322.0" y1="165.7" x2="332.0" y2="165.7"/><line x1="322.0" y1="199.6" x2="332.0" y2="199.6"/></g>
