<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">Deux signaux, et ce qu’ils font ensemble</figcaption>
<svg class="graphique" viewBox="0 0 620 320" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Deux signaux, et ce qu’ils font ensemble">
  <title>Deux signaux, et ce qu’ils font ensemble</title>
  <desc>Probabilité d’être éliminé selon qu’on cumule zéro, un ou deux signaux : avoir été visé au conseil précédent, et n’avoir plus aucun allié parmi les présents.</desc>
  <line x1="46" y1="254.0" x2="608" y2="254.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="254.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">0</text>
  <line x1="46" y1="140.0" x2="608" y2="140.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="140.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">30</text>
  <line x1="46" y1="83.0" x2="608" y2="83.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="83.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">44</text>
  <line x1="46" y1="26.0" x2="608" y2="26.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="26.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">59</text>
  <g class="marque"><title>aucun des deux signaux : 138 éliminations sur 1249 présences, soit 11 %</title><rect x="116.7" y="211.7" width="46.0" height="42.3" rx="4" fill="var(--serie-6)" stroke="var(--surface)" stroke-width="2"/><g stroke="var(--surface)" stroke-width="4"><line x1="139.7" y1="204.4" x2="139.7" y2="217.9"/><line x1="134.7" y1="204.4" x2="144.7" y2="204.4"/><line x1="134.7" y1="217.9" x2="144.7" y2="217.9"/></g><g stroke="var(--encre)" stroke-width="1.6"><line x1="139.7" y1="204.4" x2="139.7" y2="217.9"/><line x1="134.7" y1="204.4" x2="144.7" y2="204.4"/><line x1="134.7" y1="217.9" x2="144.7" y2="217.9"/></g><text x="139.7" y="194.4" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">11 %</text><text x="139.7" y="270.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">aucun</text><text x="139.7" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-muette)" font-size="10">1249 présences</text></g>
  <g class="marque"><title>un seul des deux : 73 éliminations sur 362 présences, soit 20,2 %</title><rect x="304.0" y="176.3" width="46.0" height="77.7" rx="4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"/><g stroke="var(--surface)" stroke-width="4"><line x1="327.0" y1="159.4" x2="327.0" y2="190.9"/><line x1="322.0" y1="159.4" x2="332.0" y2="159.4"/><line x1="322.0" y1="190.9" x2="332.0" y2="190.9"/></g><g stroke="var(--encre)" stroke-width="1.6"><line x1="327.0" y1="159.4" x2="327.0" y2="190.9"/><line x1="322.0" y1="159.4" x2="332.0" y2="159.4"/><line x1="322.0" y1="190.9" x2="332.0" y2="190.9"/></g><text x="327.0" y="149.4" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">20,2 %</text><text x="327.0" y="270.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">un seul</text><text x="327.0" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-muette)" font-size="10">362 présences</text></g>
  <g class="marque"><title>les deux à la fois : 10 éliminations sur 25 présences, soit 40 %</title><rect x="491.3" y="100.2" width="46.0" height="153.8" rx="4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"/><g stroke="var(--surface)" stroke-width="4"><line x1="514.3" y1="26.0" x2="514.3" y2="164.0"/><line x1="509.3" y1="26.0" x2="519.3" y2="26.0"/><line x1="509.3" y1="164.0" x2="519.3" y2="164.0"/></g><g stroke="var(--encre)" stroke-width="1.6"><line x1="514.3" y1="26.0" x2="514.3" y2="164.0"/><line x1="509.3" y1="26.0" x2="519.3" y2="26.0"/><line x1="509.3" y1="164.0" x2="519.3" y2="164.0"/></g><text x="514.3" y="16.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">40 %</text><text x="514.3" y="270.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">les deux</text><text x="514.3" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-muette)" font-size="10">25 présences</text></g>
  <line x1="46" y1="202.9" x2="608" y2="202.9" stroke="var(--encre-douce)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="608.0" y="194.9" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">le hasard : 13,3 %</text>
  <line x1="46" y1="254" x2="608" y2="254" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
