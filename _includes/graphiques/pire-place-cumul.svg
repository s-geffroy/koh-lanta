  <g stroke="var(--surface)" stroke-width="4"><line x1="139.7" y1="207.9" x2="139.7" y2="224.9"/><line x1="134.7" y1="207.9" x2="144.7" y2="207.9"/><line x1="134.7" y1="224.9" x2="144.7" y2="224.9"/></g>
