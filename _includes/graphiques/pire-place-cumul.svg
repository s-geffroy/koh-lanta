  <g stroke="var(--surface)" stroke-width="4"><line x1="327.0" y1="169.8" x2="327.0" y2="204.1"/><line x1="322.0" y1="169.8" x2="332.0" y2="169.8"/><line x1="322.0" y1="204.1" x2="332.0" y2="204.1"/></g>
