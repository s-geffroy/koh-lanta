  <g stroke="var(--surface)" stroke-width="4"><line x1="139.7" y1="205.6" x2="139.7" y2="222.0"/><line x1="134.7" y1="205.6" x2="144.7" y2="205.6"/><line x1="134.7" y1="222.0" x2="144.7" y2="222.0"/></g>
