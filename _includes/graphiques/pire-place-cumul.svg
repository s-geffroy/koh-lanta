<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">Deux signaux, et ce qu’ils font ensemble</figcaption>
<svg class="graphique" viewBox="0 0 620 320" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Deux signaux, et ce qu’ils font ensemble">
  <title>Deux signaux, et ce qu’ils font ensemble</title>
  <desc>Probabilité d’être éliminé selon qu’on cumule zéro, un ou deux signaux : avoir été visé au conseil précédent, et n’avoir plus aucun allié parmi les présents.</desc>
  <line x1="46" y1="254.0" x2="608" y2="254.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="254.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">0</text>
  <line x1="46" y1="197.0" x2="608" y2="197.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="197.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">15</text>
  <line x1="46" y1="140.0" x2="608" y2="140.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="140.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">31</text>
  <line x1="46" y1="83.0" x2="608" y2="83.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="83.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">46</text>
  <line x1="46" y1="26.0" x2="608" y2="26.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="26.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">61</text>
  <g class="marque"><title>aucun des deux signaux : 138 éliminations sur 1254 présences, soit 11 %</title><rect x="116.7" y="213.0" width="46.0" height="41.0" rx="4" fill="var(--serie-6)" stroke="var(--surface)" stroke-width="2"/><g stroke="var(--surface)" stroke-width="4"><line x1="139.7" y1="205.9" x2="139.7" y2="218.9"/><line x1="134.7" y1="205.9" x2="144.7" y2="205.9"/><line x1="134.7" y1="218.9" x2="144.7" y2="218.9"/></g><g stroke="var(--encre)" stroke-width="1.6"><line x1="139.7" y1="205.9" x2="139.7" y2="218.9"/><line x1="134.7" y1="205.9" x2="144.7" y2="205.9"/><line x1="134.7" y1="218.9" x2="144.7" y2="218.9"/></g><text x="139.7" y="195.9" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">11 %</text><text x="139.7" y="270.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">aucun</text><text x="139.7" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-muette)" font-size="10">1254 présences</text></g>
  <g class="marque"><title>un seul des deux : 73 éliminations sur 362 présences, soit 20,2 %</title><rect x="304.0" y="178.6" width="46.0" height="75.4" rx="4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"/><g stroke="var(--surface)" stroke-width="4"><line x1="327.0" y1="162.2" x2="327.0" y2="192.8"/><line x1="322.0" y1="162.2" x2="332.0" y2="162.2"/><line x1="322.0" y1="192.8" x2="332.0" y2="192.8"/></g><g stroke="var(--encre)" stroke-width="1.6"><line x1="327.0" y1="162.2" x2="327.0" y2="192.8"/><line x1="322.0" y1="162.2" x2="332.0" y2="162.2"/><line x1="322.0" y1="192.8" x2="332.0" y2="192.8"/></g><text x="327.0" y="152.2" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">20,2 %</text><text x="327.0" y="270.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">un seul</text><text x="327.0" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-muette)" font-size="10">362 présences</text></g>
  <g class="marque"><title>les deux à la fois : 11 éliminations sur 26 présences, soit 42,3 %</title><rect x="491.3" y="96.2" width="46.0" height="157.8" rx="4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"/><g stroke="var(--surface)" stroke-width="4"><line x1="514.3" y1="26.0" x2="514.3" y2="158.8"/><line x1="509.3" y1="26.0" x2="519.3" y2="26.0"/><line x1="509.3" y1="158.8" x2="519.3" y2="158.8"/></g><g stroke="var(--encre)" stroke-width="1.6"><line x1="514.3" y1="26.0" x2="514.3" y2="158.8"/><line x1="509.3" y1="26.0" x2="519.3" y2="26.0"/><line x1="509.3" y1="158.8" x2="519.3" y2="158.8"/></g><text x="514.3" y="16.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">42,3 %</text><text x="514.3" y="270.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">les deux</text><text x="514.3" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-muette)" font-size="10">26 présences</text></g>
  <line x1="46" y1="204.4" x2="608" y2="204.4" stroke="var(--encre-douce)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="608.0" y="196.4" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">le hasard : 13,3 %</text>
  <line x1="46" y1="254" x2="608" y2="254" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
