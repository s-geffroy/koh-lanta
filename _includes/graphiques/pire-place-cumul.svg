<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">Deux signaux, et ce qu’ils font ensemble</figcaption>
<svg class="graphique" viewBox="0 0 620 320" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Deux signaux, et ce qu’ils font ensemble">
  <title>Deux signaux, et ce qu’ils font ensemble</title>
  <desc>Probabilité d’être éliminé selon qu’on cumule zéro, un ou deux signaux : avoir été visé au conseil précédent, et n’avoir plus aucun allié parmi les présents.</desc>
  <line x1="46" y1="254.0" x2="608" y2="254.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="254.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">0</text>
  <line x1="46" y1="197.0" x2="608" y2="197.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="197.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">16</text>
  <line x1="46" y1="140.0" x2="608" y2="140.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="140.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">31</text>
  <line x1="46" y1="83.0" x2="608" y2="83.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="83.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">47</text>
  <line x1="46" y1="26.0" x2="608" y2="26.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="26.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">63</text>
  <g class="marque"><title>aucun des deux signaux : 115 éliminations sur 1059 présences, soit 10,9 %</title><rect x="116.7" y="214.4" width="46.0" height="39.6" rx="4" fill="var(--serie-6)" stroke="var(--surface)" stroke-width="2"/><g stroke="var(--surface)" stroke-width="4"><line x1="139.7" y1="207.1" x2="139.7" y2="220.9"/><line x1="134.7" y1="207.1" x2="144.7" y2="207.1"/><line x1="134.7" y1="220.9" x2="144.7" y2="220.9"/></g><g stroke="var(--encre)" stroke-width="1.6"><line x1="139.7" y1="207.1" x2="139.7" y2="220.9"/><line x1="134.7" y1="207.1" x2="144.7" y2="207.1"/><line x1="134.7" y1="220.9" x2="144.7" y2="220.9"/></g><text x="139.7" y="197.1" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">10,9 %</text><text x="139.7" y="270.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">aucun</text><text x="139.7" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-muette)" font-size="10">1059 présences</text></g>
  <g class="marque"><title>un seul des deux : 65 éliminations sur 312 présences, soit 20,8 %</title><rect x="304.0" y="178.4" width="46.0" height="75.6" rx="4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"/><g stroke="var(--surface)" stroke-width="4"><line x1="327.0" y1="160.5" x2="327.0" y2="193.3"/><line x1="322.0" y1="160.5" x2="332.0" y2="160.5"/><line x1="322.0" y1="193.3" x2="332.0" y2="193.3"/></g><g stroke="var(--encre)" stroke-width="1.6"><line x1="327.0" y1="160.5" x2="327.0" y2="193.3"/><line x1="322.0" y1="160.5" x2="332.0" y2="160.5"/><line x1="322.0" y1="193.3" x2="332.0" y2="193.3"/></g><text x="327.0" y="150.5" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">20,8 %</text><text x="327.0" y="270.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">un seul</text><text x="327.0" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-muette)" font-size="10">312 présences</text></g>
  <g class="marque"><title>les deux à la fois : 12 éliminations sur 27 présences, soit 44,4 %</title><rect x="491.3" y="92.5" width="46.0" height="161.5" rx="4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"/><g stroke="var(--surface)" stroke-width="4"><line x1="514.3" y1="26.0" x2="514.3" y2="153.6"/><line x1="509.3" y1="26.0" x2="519.3" y2="26.0"/><line x1="509.3" y1="153.6" x2="519.3" y2="153.6"/></g><g stroke="var(--encre)" stroke-width="1.6"><line x1="514.3" y1="26.0" x2="514.3" y2="153.6"/><line x1="509.3" y1="26.0" x2="519.3" y2="26.0"/><line x1="509.3" y1="153.6" x2="519.3" y2="153.6"/></g><text x="514.3" y="16.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">44,4 %</text><text x="514.3" y="270.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">les deux</text><text x="514.3" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-muette)" font-size="10">27 présences</text></g>
  <line x1="46" y1="204.9" x2="608" y2="204.9" stroke="var(--encre-douce)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="608.0" y="196.9" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">le hasard : 13,5 %</text>
  <line x1="46" y1="254" x2="608" y2="254" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
