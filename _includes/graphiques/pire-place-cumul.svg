<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">Deux signaux, et ce qu’ils font ensemble</figcaption>
<svg class="graphique" viewBox="0 0 620 320" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Deux signaux, et ce qu’ils font ensemble">
  <title>Deux signaux, et ce qu’ils font ensemble</title>
  <desc>Probabilité d’être éliminé selon qu’on cumule zéro, un ou deux signaux : avoir été visé au conseil précédent, et n’avoir plus aucun allié parmi les présents.</desc>
  <line x1="46" y1="254.0" x2="608" y2="254.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="254.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">0</text>
  <line x1="46" y1="140.0" x2="608" y2="140.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="140.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">29</text>
  <line x1="46" y1="83.0" x2="608" y2="83.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="83.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">43</text>
  <line x1="46" y1="26.0" x2="608" y2="26.0" stroke="var(--grille)" stroke-width="1"/>
  <text x="38.0" y="26.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">58</text>
  <g class="marque"><title>aucun des deux signaux : 144 éliminations sur 1311 présences, soit 11 %</title><rect x="116.7" y="210.4" width="46.0" height="43.6" rx="4" fill="var(--serie-6)" stroke="var(--surface)" stroke-width="2"/><g stroke="var(--surface)" stroke-width="4"><line x1="139.7" y1="203.2" x2="139.7" y2="216.7"/><line x1="134.7" y1="203.2" x2="144.7" y2="203.2"/><line x1="134.7" y1="216.7" x2="144.7" y2="216.7"/></g><g stroke="var(--encre)" stroke-width="1.6"><line x1="139.7" y1="203.2" x2="139.7" y2="216.7"/><line x1="134.7" y1="203.2" x2="144.7" y2="203.2"/><line x1="134.7" y1="216.7" x2="144.7" y2="216.7"/></g><text x="139.7" y="193.2" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">11 %</text><text x="139.7" y="270.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">aucun</text><text x="139.7" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-muette)" font-size="10">1311 présences</text></g>
  <g class="marque"><title>un seul des deux : 74 éliminations sur 383 présences, soit 19,3 %</title><rect x="304.0" y="177.5" width="46.0" height="76.5" rx="4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"/><g stroke="var(--surface)" stroke-width="4"><line x1="327.0" y1="160.4" x2="327.0" y2="191.7"/><line x1="322.0" y1="160.4" x2="332.0" y2="160.4"/><line x1="322.0" y1="191.7" x2="332.0" y2="191.7"/></g><g stroke="var(--encre)" stroke-width="1.6"><line x1="327.0" y1="160.4" x2="327.0" y2="191.7"/><line x1="322.0" y1="160.4" x2="332.0" y2="160.4"/><line x1="322.0" y1="191.7" x2="332.0" y2="191.7"/></g><text x="327.0" y="150.4" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">19,3 %</text><text x="327.0" y="270.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">un seul</text><text x="327.0" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-muette)" font-size="10">383 présences</text></g>
  <g class="marque"><title>les deux à la fois : 10 éliminations sur 26 présences, soit 38,5 %</title><rect x="491.3" y="101.3" width="46.0" height="152.7" rx="4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"/><g stroke="var(--surface)" stroke-width="4"><line x1="514.3" y1="26.0" x2="514.3" y2="165.2"/><line x1="509.3" y1="26.0" x2="519.3" y2="26.0"/><line x1="509.3" y1="165.2" x2="519.3" y2="165.2"/></g><g stroke="var(--encre)" stroke-width="1.6"><line x1="514.3" y1="26.0" x2="514.3" y2="165.2"/><line x1="509.3" y1="26.0" x2="519.3" y2="26.0"/><line x1="509.3" y1="165.2" x2="519.3" y2="165.2"/></g><text x="514.3" y="16.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre)" font-size="11" font-weight="600">38,5 %</text><text x="514.3" y="270.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">les deux</text><text x="514.3" y="285.0" text-anchor="middle" dominant-baseline="middle" fill="var(--encre-muette)" font-size="10">26 présences</text></g>
  <line x1="46" y1="202.5" x2="608" y2="202.5" stroke="var(--encre-douce)" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="608.0" y="194.5" text-anchor="end" dominant-baseline="middle" fill="var(--encre-douce)" font-size="11">le hasard : 13 %</text>
  <line x1="46" y1="254" x2="608" y2="254" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
