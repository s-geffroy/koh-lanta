<figure class="figure">
<svg class="graphique" viewBox="0 0 680 174" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Être visé, et finir la saison">
  <title>Être visé, et finir la saison</title>
  <desc>Nombre moyen de voix reçues par conseil, selon le sort final.</desc>
  <line x1="312.0" y1="10" x2="312.0" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <line x1="414.0" y1="10" x2="414.0" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <line x1="516.0" y1="10" x2="516.0" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <line x1="618.0" y1="10" x2="618.0" y2="148" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>Éliminé au conseil : 0.9 voix reçues par conseil en moyenne</title><rect x="210" y="16" width="408.0" height="26" rx="4" fill="var(--serie-8)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="200.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Éliminé au conseil</text>
  <text x="626.0" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">0.9</text>
  <g class="marque"><title>Éliminé à l&#x27;orientation : 0.5 voix reçues par conseil en moyenne</title><rect x="210" y="50" width="226.7" height="26" rx="4" fill="var(--serie-8)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="200.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Éliminé à l&#x27;orientation</text>
  <text x="444.7" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">0.5</text>
  <g class="marque"><title>Finaliste : 0.3 voix reçues par conseil en moyenne</title><rect x="210" y="84" width="136.0" height="26" rx="4" fill="var(--serie-8)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="200.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Finaliste</text>
  <text x="354.0" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">0.3</text>
  <g class="marque"><title>Vainqueur : 0.1 voix reçues par conseil en moyenne</title><rect x="210" y="118" width="45.3" height="26" rx="4" fill="var(--serie-8)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="200.0" y="131.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Vainqueur</text>
  <text x="263.3" y="131.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">0.1</text>
  <line x1="210" y1="10" x2="210" y2="148" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
