<figure class="figure">
<figcaption class="figure-titre" aria-hidden="true">Être visé, et finir la saison</figcaption>
<svg class="graphique" viewBox="0 0 680 208" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Être visé, et finir la saison">
  <title>Être visé, et finir la saison</title>
  <desc>Nombre moyen de voix reçues par conseil, selon le sort final.</desc>
  <line x1="312.0" y1="10" x2="312.0" y2="182" stroke="var(--grille)" stroke-width="1"/>
  <line x1="414.0" y1="10" x2="414.0" y2="182" stroke="var(--grille)" stroke-width="1"/>
  <line x1="516.0" y1="10" x2="516.0" y2="182" stroke="var(--grille)" stroke-width="1"/>
  <line x1="618.0" y1="10" x2="618.0" y2="182" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>Éliminé au conseil : 1 voix reçue par conseil en moyenne</title><rect x="210" y="16" width="408.0" height="26" rx="4" fill="var(--serie-8)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Éliminé au conseil</text><text x="626.0" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">1</text></g>
  <g class="marque"><title>Éliminé à l’orientation : 0,4 voix reçue par conseil en moyenne</title><rect x="210" y="50" width="163.2" height="26" rx="4" fill="var(--serie-8)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Éliminé à l’orientation</text><text x="381.2" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">0,4</text></g>
  <g class="marque"><title>Éliminé aux poteaux : 0,4 voix reçue par conseil en moyenne</title><rect x="210" y="84" width="163.2" height="26" rx="4" fill="var(--serie-8)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Éliminé aux poteaux</text><text x="381.2" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">0,4</text></g>
  <g class="marque"><title>Finaliste : 0,4 voix reçue par conseil en moyenne</title><rect x="210" y="118" width="163.2" height="26" rx="4" fill="var(--serie-8)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="131.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Finaliste</text><text x="381.2" y="131.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">0,4</text></g>
  <g class="marque"><title>Vainqueur : 0,2 voix reçue par conseil en moyenne</title><rect x="210" y="152" width="81.6" height="26" rx="4" fill="var(--serie-8)" stroke="var(--surface)" stroke-width="2"/><text x="200.0" y="165.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Vainqueur</text><text x="299.6" y="165.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">0,2</text></g>
