  <text x="236.9" y="233.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">2.3 %</text>
  <g class="marque"><title>Abandon volontaire : 0 rappelés sur 16, soit 0.0 % (intervalle 0.0 à 19.4 %)</title><rect x="210" y="254" width="3.0" height="26" rx="4" fill="var(--serie-8)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="200.0" y="267.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Abandon volontaire</text>
  <text x="221.0" y="267.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">0.0 %</text>
  <line x1="210" y1="10" x2="210" y2="284" stroke="var(--axe)" stroke-width="1"/>
