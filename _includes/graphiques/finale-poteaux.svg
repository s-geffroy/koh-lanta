  <g stroke="var(--surface)" stroke-width="4"><line x1="512.5" y1="78.1" x2="512.5" y2="200.1"/><line x1="507.5" y1="78.1" x2="517.5" y2="78.1"/><line x1="507.5" y1="200.1" x2="517.5" y2="200.1"/></g>
