  <title>Accès à la finale selon le sexe</title>
  <desc>Part des aventurières et des aventuriers ayant atteint la finale.</desc>
  <line x1="237.0" y1="10" x2="237.0" y2="80" stroke="var(--grille)" stroke-width="1"/>
  <line x1="364.0" y1="10" x2="364.0" y2="80" stroke="var(--grille)" stroke-width="1"/>
  <line x1="491.0" y1="10" x2="491.0" y2="80" stroke="var(--grille)" stroke-width="1"/>
  <line x1="618.0" y1="10" x2="618.0" y2="80" stroke="var(--grille)" stroke-width="1"/>
