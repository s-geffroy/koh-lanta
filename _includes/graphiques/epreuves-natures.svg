  <g class="marque"><title>4 épreuves récurrentes que le wiki qualifie de « équilibre »</title><rect x="130" y="152" width="122.0" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/></g>
