<figure class="figure">
<svg class="graphique" viewBox="0 0 680 310" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Ce que le wiki dit de la nature des épreuves">
  <title>Ce que le wiki dit de la nature des épreuves</title>
  <desc>Nombre d&#x27;épreuves récurrentes portant chaque qualificatif. Une épreuve peut en porter deux — « rapidité, force ».</desc>
  <line x1="252.0" y1="10" x2="252.0" y2="284" stroke="var(--grille)" stroke-width="1"/>
