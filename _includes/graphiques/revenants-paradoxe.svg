<figure class="figure">
<svg class="graphique" viewBox="0 0 880 140" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Le paradoxe des revenants">
  <title>Le paradoxe des revenants</title>
  <desc>Part moyenne de la saison passée en jeu, selon que l&#x27;aventurier a été rappelé ou non, et selon qu&#x27;il s&#x27;agit de sa première aventure ou d&#x27;un retour.</desc>
  <line x1="399.5" y1="10" x2="399.5" y2="114" stroke="var(--grille)" stroke-width="1"/>
  <line x1="539.0" y1="10" x2="539.0" y2="114" stroke="var(--grille)" stroke-width="1"/>
  <line x1="678.5" y1="10" x2="678.5" y2="114" stroke="var(--grille)" stroke-width="1"/>
  <line x1="818.0" y1="10" x2="818.0" y2="114" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>Jamais rappelés : 448 aventures, 56.7 % de la saison en moyenne</title><rect x="260" y="16" width="316.4" height="26" rx="4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="250.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Jamais rappelés</text>
  <text x="584.4" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">56.7 %</text>
  <g class="marque"><title>Revenants, leur première saison : 83 aventures, 84.1 % de la saison en moyenne</title><rect x="260" y="50" width="469.3" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="250.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Revenants, leur première saison</text>
  <text x="737.3" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">84.1 %</text>
  <g class="marque"><title>Revenants, leurs saisons suivantes : 96 aventures, 63.7 % de la saison en moyenne</title><rect x="260" y="84" width="355.4" height="26" rx="4" fill="var(--serie-2)" stroke="var(--surface)" stroke-width="2"/></g>
  <text x="250.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Revenants, leurs saisons suivantes</text>
  <text x="623.4" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">63.7 %</text>
  <line x1="260" y1="10" x2="260" y2="114" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
