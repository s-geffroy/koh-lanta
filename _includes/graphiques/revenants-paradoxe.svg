<figure class="figure">
<svg class="graphique" viewBox="0 0 880 140" role="img" preserveAspectRatio="xMidYMid meet" aria-label="Le paradoxe des revenants">
  <title>Le paradoxe des revenants</title>
  <desc>Part moyenne de la saison passée en jeu, selon que l&#x27;aventurier a été rappelé ou non, et selon qu&#x27;il s&#x27;agit de sa première aventure ou d&#x27;un retour.</desc>
  <line x1="398.9" y1="10" x2="398.9" y2="114" stroke="var(--grille)" stroke-width="1"/>
  <line x1="537.8" y1="10" x2="537.8" y2="114" stroke="var(--grille)" stroke-width="1"/>
  <line x1="676.7" y1="10" x2="676.7" y2="114" stroke="var(--grille)" stroke-width="1"/>
  <line x1="815.6" y1="10" x2="815.6" y2="114" stroke="var(--grille)" stroke-width="1"/>
  <g class="marque"><title>Jamais rappelés : 448 aventures, 56.7 % de la saison en moyenne</title><rect x="260" y="16" width="315.0" height="26" rx="4" fill="var(--serie-1)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="29.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="13">Jamais rappelés</text><text x="583.0" y="29.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">56.7 %</text></g>
  <g class="marque"><title>Revenants, leur première saison : 83 aventures, 84.1 % de la saison en moyenne</title><rect x="260" y="50" width="467.3" height="26" rx="4" fill="var(--serie-3)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="63.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="12">Revenants, leur première saison</text><text x="735.3" y="63.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">84.1 %</text></g>
  <g class="marque"><title>Revenants, leurs saisons suivantes : 96 aventures, 63.7 % de la saison en moyenne</title><rect x="260" y="84" width="353.9" height="26" rx="4" fill="var(--serie-2)" stroke="var(--surface)" stroke-width="2"/><text x="250.0" y="97.0" text-anchor="end" dominant-baseline="middle" fill="var(--encre)" font-size="11">Revenants, leurs saisons suivantes</text><text x="621.9" y="97.0" text-anchor="start" dominant-baseline="middle" fill="var(--encre)" font-size="13" font-weight="600">63.7 %</text></g>
  <line x1="260" y1="10" x2="260" y2="114" stroke="var(--axe)" stroke-width="1"/>
</svg>
</figure>
