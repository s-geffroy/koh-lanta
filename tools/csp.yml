# Taxonomie des professions.
#
# Elle sert a repondre a une question precise : quels metiers menent le plus
# loin dans le jeu ? Sans regroupement, 500 intitules distincts ne disent rien.
#
# La classification est faite par mots-cles, dans l'ORDRE de ce fichier : le
# premier poste dont un mot-cle apparait dans l'intitule l'emporte. L'ordre est
# donc porteur de sens -- « educateur sportif » doit rencontrer `sport` avant
# `enseignement`, « maitre-nageur » doit rencontrer `action_securite` avant
# `sport`.
#
# Les mots-cles sont compares SANS ACCENTS et en minuscules. Un mot-cle vaut
# pour toutes ses variantes de genre et de nombre des lors qu'il est ecrit sous
# sa forme la plus courte (« infirmi » couvre infirmier, infirmiere, infirmiers).
#
# Ce fichier est fait pour etre relu et discute : si un classement parait
# faux, c'est ici qu'il se corrige, pas dans le code.

postes:
  - code: action_securite
    libelle: "Action et sécurité"
    description: "Métiers d'intervention et de secours."
    mots: [militaire, pompier, gendarme, policier, police, "agent de securite",
           securite, secouriste, sauveteur, "maitre-nageur", "maitre nageur",
           ambulancier, parachut, marin, "garde du corps", legion, commando,
           "surveillant penitentiaire", douanier, "expert en survie",
           "agent de prevention", "gardien de la paix", "inspecteur de police",
           "instructeur de survie", "instructrice de survie", "garde-champetre", "ecogarde", "pompes funebres"]

