# Politique d'exposition de l'application. Volontairement minimal.
#
# Ce projet ne deploie RIEN sur ce VPS : le site est construit et servi par
# GitHub Pages, a chaque `git push`. Il n'y a donc ni service, ni exposition,
# ni nom d'hote, ni route Traefik -- et le domaine personnalise du site, s'il y
# en a un, se regle chez GitHub et chez le registrar DNS, jamais ici.
#
# Ce que l'application apporte quand meme, et qui est tout l'interet : son
# utilisateur Unix dedie, son repertoire, son depot Git, et son Claude Code
# authentifie a lui -- separe de toutes les autres applications du VPS.
#
# 'services' vide est un cas prevu : `appctl validate` annonce 0 service,
# `build` et `up` sortent en 0, et `workon new` traverse les etapes
# d'exposition et de verification HTTP sans rien demander.
name: koh-lanta

services: {}
