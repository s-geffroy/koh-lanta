# Les saisons de Koh-Lanta.
#
# Source : fr.wikipedia.org/wiki/Koh-Lanta (tableau « Deroulement »), verifie
# contre les pages de chaque saison. Les identifiants `id` servent de cle
# etrangere depuis participations.yml, epreuves.yml, conseils.yml et
# colliers.yml.
#
# `numero` suit la numerotation officielle des editions regulieres. Les
# editions speciales n'y entrent pas : elles ont leur propre suite (`rang`).
# Les saisons 13 (2013) et 19 (2018) ont ete annulees en cours de tournage :
# elles figurent ici avec `annulee: true` et aucun candidat, pour que la
# numerotation reste lisible.

